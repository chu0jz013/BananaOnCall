apiVersion: apps/v1
kind: Deployment
metadata:
  name: bananaoncall
  namespace: bananaoncall
spec:
  replicas: 2
  selector:
    matchLabels: {app: bananaoncall}
  template:
    metadata:
      labels: {app: bananaoncall}
    spec:
      containers:
        - name: api
          image: bananaoncall:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
