<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BananaOnCall — Documentation</title>
    <meta name="description" content="BananaOnCall — an on-call engine on AWS Serverless. Alertmanager in, Telegram with an Ack button out, escalation when nobody answers." />
    <link rel="icon" type="image/png" sizes="32x32" href="/picture/favicon-32.png" />
    <link rel="apple-touch-icon" href="/picture/logo-mark-180.png" />

    <!-- Absolute URLs: a scraper has no page to resolve a relative one against. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oncall.quachuoitrenmay.com/" />
    <meta property="og:title" content="BananaOnCall — Documentation" />
    <meta property="og:description" content="BananaOnCall — an on-call engine on AWS Serverless. Alertmanager in, Telegram with an Ack button out, escalation when nobody answers." />
    <meta property="og:image" content="https://oncall.quachuoitrenmay.com/picture/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Applied before React mounts so there is no flash of the wrong palette.
      try {
        var t = localStorage.getItem('bananaoncall.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('bananaoncall.lang');
        if (l === 'vi' || l === 'en') document.documentElement.lang = l;
      } catch (e) { /* private windows throw; the defaults are fine */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
